[project]
name = "paper-room"
version = "1.0.0"
description = "纸间 Paper Room 后端：本地优先的个人漫画收藏夹"
license = "AGPL-3.0-or-later"
requires-python = ">=3.14"
# 直接依赖一律精准锁定（==），传递依赖由 uv.lock 全量锁死（见 docs/PITFALLS.md #168）。
# 台词 OCR 与语义检索的推理依赖不在这张表里：前者见 scripts/requirements-ocr*.txt，后者见 DEPLOYMENT.md §5.1.2。
dependencies = [
  "jmcomic==2.7.4",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "curl-cffi==0.16.2",
  "pillow==12.3.0",
  "python-multipart==0.0.32",
  "watchfiles==1.2.0",
  "pymupdf==1.28.2",
  "pycryptodome==3.23.0",
  # 代码里直接 import，版本跟随 fastapi 的约束，由 uv.lock 锁定
  "pydantic",
  "starlette",
]

[dependency-groups]
dev = ["httpx2>=2.13", "ruff", "ty"]

[tool.uv]
# 这是应用不是库：不构建、不安装自身，只管理依赖
package = false

# 国内镜像源写进仓库，与 .npmrc 的做法一致：uv 在 --locked 下不允许安装时临时换源（会判定锁文件失效）。
# 海外使用者删掉本段后重跑 `uv lock` 即可切回官方 PyPI。
[[tool.uv.index]]
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 120
