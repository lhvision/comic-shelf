services:
  paper-room:
    image: paper-room:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paper-room
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Shanghai
      COMIC_SHELF_DATA: /app/data
      COMIC_SHELF_HOST: 0.0.0.0
      COMIC_SHELF_PORT: 8000
      COMIC_SHELF_IMSEARCH_URL: ${COMIC_SHELF_IMSEARCH_URL:-http://imsearch:8765}
      # 外部目录直扫放行白名单（若解开下方 volumes 外部挂载，可同步解开此行，须与容器内挂载点保持一致）：
      # COMIC_SHELF_ALLOWED_DIRS: '/external-comics'
      # 其余业务与安全配置（馆长密码、Token、网络代理等）请配置在宿主机根目录 .env 或持久化卷 ./backend/data/.env 中；
      # 详细参数说明与模板参见根目录 .env.example
    volumes:
      # 核心数据持久化目录（存放所有漫画原图、元数据、封面、缩略图、数据库与持久配置 .env 等）：
      # 默认映射本地相对路径 ./backend/data；若在 TrueNAS / 群晖 / Unraid 等 NAS 部署，可改为宿主机绝对路径，例如：
      # - /mnt/pool/apps/comic-shelf:/app/data
      - ./backend/data:/app/data
      # 若需从 NAS 外部目录直扫收录漫画，解开并映射外部路径（同时解开上方 COMIC_SHELF_ALLOWED_DIRS 白名单）：
      # - /mnt/tank/comics:/external-comics:ro
    ports:
      # 宿主机访问端口映射（格式为 '宿主机端口:容器内部端口'）：
      # 若 8000 端口已被其他服务占用，只需修改冒号左侧的宿主机端口，例如改为 '9000:8000'
      - '8000:8000'
    depends_on:
      - imsearch

  imsearch:
    image: aloxaf/imsearch:latest
    container_name: paper-room-imsearch
    restart: unless-stopped
    volumes:
      # 以图搜图数据源与特征库持久化：
      # 注意：若上面 paper-room 修改了宿主机路径，这里务必同步修改为一致的宿主机路径：
      # - /mnt/pool/apps/comic-shelf:/app/data
      # - /mnt/pool/apps/comic-shelf/imsearch:/root/.config/imsearch
      - ./backend/data:/app/data
      - ./backend/data/imsearch:/root/.config/imsearch
    command: ['server', '--addr', '0.0.0.0:8765', '--nprobe', '32', '--count', '20']
    # 识图引擎为内部 Sidecar，默认仅绑定宿主机环回 127.0.0.1 防范公网扫描；
    # 容器间走 Docker 内部网络（http://imsearch:8765）安全互通。
    ports:
      - '127.0.0.1:8765:8765'
